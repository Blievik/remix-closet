# Remix Closet: one Cloudflare Worker serves the app, the AI stylist, and the shared feed.
name = "remix-closet"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The app files. /api/* runs the Worker code first; everything else is served from ./public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Claude features (AI stylist, photo and tag reading). "false" = no API calls and no cost;
# the app uses its built-in stylist instead. Set to "true" only if you want to pay for Claude.
AI_ENABLED = "false"
# Cheapest Claude model that can read photos. Switch to "claude-sonnet-5-5" if it misreads clothes.
MODEL = "claude-haiku-5-5"
# Only needed if the page is hosted somewhere other than this Worker. Comma separated, no trailing slash.
ALLOWED_ORIGINS = ""

# The shared feed's database. Cloudflare creates it automatically on the first deploy.
# If a deploy ever says it can't find it, run `npx wrangler d1 create remix-closet-feed`
# and paste the database_id it prints on a new line below.
[[d1_databases]]
binding = "DB"
database_name = "remix-closet-feed"

# Rate limits per visitor IP. Cloudflare allows a period of 10 or 60 seconds.
# namespace_id only has to be a number that's unique in your Cloudflare account.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "7201"
  [ratelimits.simple]
  limit = 8       # stylist picks and photo reads per minute
  period = 60

[[ratelimits]]
name = "POST_LIMITER"
namespace_id = "7202"
  [ratelimits.simple]
  limit = 3       # new posts per minute
  period = 60

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "7203"
  [ratelimits.simple]
  limit = 30      # likes, reports and deletes per minute
  period = 60

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "7204"
  [ratelimits.simple]
  limit = 60      # feed refreshes per minute
  period = 60

[observability]
enabled = true

# Secrets are NOT in this file. Add them in the Cloudflare dashboard
# (Workers & Pages > remix-closet > Settings > Variables and Secrets) or with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ADMIN_KEY
